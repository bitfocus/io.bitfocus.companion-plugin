name: Build

on:
  push:
    # Branch pushes only. Tag pushes are handled by release.yml, and a
    # `branches` filter already excludes tags.
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint (formatting)
        run: yarn lint

      - name: Type check
        run: yarn check-types

      - name: Build
        run: yarn build

      - name: Package Stream Deck plugin
        run: yarn streamdeck pack io.bitfocus.companion-plugin.sdPlugin --force

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: io.bitfocus.companion-plugin
          path: '*.streamDeckPlugin'
          if-no-files-found: error
